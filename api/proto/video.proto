syntax = "proto3";

package video;
option go_package = "api/proto/video";

import "api/proto/user.proto";

// --- 基础消息 ---
message Video {
    int64 id = 1;
    user.User author = 2; // 改成引用 user 包里的 User 消息
    string title = 3;
    string play_url = 4;
    string cover_url = 5;
    int64 favorite_count = 6;
    int64 comment_count = 7;
    bool is_favorite = 8; // 当前登录用户是否点赞
    int32 status = 9;     // 0-待审, 1-发布, 2-驳回
    string hls_url = 10;  // HLS 切片播放地址 (异步转码生成，可能为空)
}

// --- 请求与响应 ---

// 投稿请求 (Web-server处理文件分片后传给Logic)
message PublishRequest {
    string token = 1;
    string title = 2;
    bytes data = 3; // 视频二进制数据
    string filename = 4; // 视频文件名，用于OSS存储 
}

message PublishResponse {
    int32 status_code = 1;
    string status_msg = 2;
}

// 获取视频流 (Feed)
message FeedRequest {
    int64 latest_time = 1; // 限制返回视频的最新投稿时间戳
    string token = 2;      // 可选，用于判断用户是否点赞过
    string mode = 3;       // latest=时间流(默认) / hot=热门流 / mix=推荐流(三路召回)
}

message FeedResponse {
    int32 status_code = 1;
    string status_msg = 2;
    repeated Video video_list = 3;
    int64 next_time = 4;   // 翻页用的时间戳
}

// 物理删除请求
message DeleteRequest {
    int64 user_id = 1;
    int64 video_id = 2;
}

message DeleteResponse {
    int32 status_code = 1;
    string status_msg = 2;
}

// 获取用户投稿列表
message PublishListRequest {
    int64 user_id = 1; // 目标用户的ID
    string token = 2;  // 访问者的token
}

message PublishListResponse {
    int32 status_code = 1;
    string status_msg = 2;
    repeated Video video_list = 3; 
}

// 管理员审核
message AuditRequest {
    int64 admin_id = 1;
    int64 video_id = 2;
    int32 action = 3; // 1-通过, 2-驳回
    string reason = 4;
}

message AuditResponse {
    int32 status_code = 1;
    string status_msg = 2;
}
// 获取关注用户的视频流 (FollowingFeed)
message FollowingFeedRequest {
    int64 user_id = 1; // 当前登录用户的ID
    string token = 2;  // 访问者的token
}

message FollowingFeedResponse {
    int32 status_code = 1;
    string status_msg = 2;
    repeated Video video_list = 3; 
    int64 next_time = 4;   // 翻页用的时间戳
}

// --- 服务定义 ---
service VideoService {
    rpc Feed(FeedRequest) returns (FeedResponse);
    rpc PublishVideo(PublishRequest) returns (PublishResponse);
    rpc DeleteVideo(DeleteRequest) returns (DeleteResponse);
    rpc AuditVideo(AuditRequest) returns (AuditResponse);
    rpc GetPublishList(PublishListRequest) returns (PublishListResponse);
    rpc FollowingFeed(FollowingFeedRequest) returns (FollowingFeedResponse);
    rpc ListPendingVideos(PendingListRequest) returns (PendingListResponse);
    // 大文件分片上传：初始化(秒传/续传判断) → 逐片上传 → 完成
    rpc InitUpload(InitUploadRequest) returns (InitUploadResponse);
    rpc UploadPart(UploadPartRequest) returns (UploadPartResponse);
    rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
    // 签名直传：后端只签发凭证，文件字节直接 浏览器→OSS，不过应用服务器
    rpc GetDirectUploadURL(DirectUploadURLRequest) returns (DirectUploadURLResponse);
    rpc CompleteDirectUpload(CompleteDirectRequest) returns (CompleteDirectResponse);
    // 推荐效果统计：各流量来源的曝光/点赞计数 (管理员)
    rpc GetFeedStats(FeedStatsRequest) returns (FeedStatsResponse);
}

// --- 推荐效果统计 ---
message FeedStatsRequest {
    int64 admin_id = 1;
}

message FeedStatsResponse {
    int32 status_code = 1;
    string status_msg = 2;
    map<string, int64> expose = 3;   // 来源(mix/hot/latest) -> 曝光数
    map<string, int64> favorite = 4; // 来源 -> 点赞数
}

// --- 分片上传 ---
message InitUploadRequest {
    string token = 1;
    string filename = 2;       // 原文件名，用于取后缀
    int64 file_size = 3;       // 总字节数
    string file_md5 = 4;       // 整个文件的 MD5，秒传/续传识别
    string prev_upload_id = 5; // 断点续传：上次会话的 upload_id，可为空
}

message InitUploadResponse {
    int32 status_code = 1;
    string status_msg = 2;
    bool uploaded = 3;         // true = 秒传命中，直接调 CompleteUpload 即可
    string upload_id = 4;      // OSS 分片上传会话 ID
    repeated int32 existed_parts = 5; // 断点续传：已成功的分片号，客户端跳过
}

message UploadPartRequest {
    string token = 1;
    string upload_id = 2;
    int32 part_number = 3;     // 从 1 开始
    bytes data = 4;
}

message UploadPartResponse {
    int32 status_code = 1;
    string status_msg = 2;
}

message CompleteUploadRequest {
    string token = 1;
    string upload_id = 2;      // 秒传时可为空
    string file_md5 = 3;       // 秒传时必填
    string title = 4;
}

message CompleteUploadResponse {
    int32 status_code = 1;
    string status_msg = 2;
    int64 video_id = 3;
}

// --- 签名直传 (小文件优选通道: 浏览器 PUT 直传 OSS) ---
message DirectUploadURLRequest {
    string token = 1;
    string filename = 2;
    string file_md5 = 3;
    int64 file_size = 4;
}

message DirectUploadURLResponse {
    int32 status_code = 1;
    string status_msg = 2;
    bool uploaded = 3;       // 秒传命中，无需任何上传
    int64 video_id = 4;      // uploaded=true 时的已建记录
    string upload_url = 5;   // 带签名的 PUT URL (15 分钟有效)
    string upload_token = 6; // 完成时带回，服务端据此校验归属
}

message CompleteDirectRequest {
    string token = 1;
    string upload_token = 2;
    string title = 3;
}

message CompleteDirectResponse {
    int32 status_code = 1;
    string status_msg = 2;
    int64 video_id = 3;
}

// 待审核视频列表 (管理员后台)
message PendingListRequest {
    int64 admin_id = 1;
    string token = 2;
    int32 page = 3;      // 页码，从 1 开始
    int32 page_size = 4; // 每页数量
}

message PendingListResponse {
    int32 status_code = 1;
    string status_msg = 2;
    repeated Video video_list = 3;
    int64 total = 4;
}